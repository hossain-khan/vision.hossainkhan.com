<div class="contact-form">

	<form method="post" action="{{ site.data.settings.contact_settings.form_action }}" id="contact-form">

		<div class="contact-form__item">
			<label for="contact-email" class="contact-form__label">Email Address *</label>
			<input id="contact-email" type="email" name="email" autocomplete="email" required placeholder="Your email address..." class="contact-form__input">
		</div>

		<div class="contact-form__item">
			<label for="contact-name" class="contact-form__label">Name *</label>
			<input id="contact-name" type="text" name="name" autocomplete="name" required placeholder="Your name..." class="contact-form__input">
		</div>

		<div class="contact-form__item">
			<label for="contact-message" class="contact-form__label">Message *</label>
			<textarea id="contact-message" name="message" required placeholder="Your message..." class="contact-form__textarea"></textarea>
		</div>

		<input type="hidden" name="_next" value="{{ site.data.settings.contact_settings.confirmation_url }}" />
		<input type="hidden" name="_subject" value="{{ site.data.settings.contact_settings.email_subject }}" />
		<input type="text" name="_gotcha" style="display: none;" class="contact-form__gotcha" val="">

		<div class="contact-form__item">
			<input type="submit" value="{{ site.data.settings.contact_settings.send_button_text }}" class="button button--large">
		</div>

	</form>

</div>
